<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="description"
            content="ChessRecord - Log and Store Your Chess Games"
        />
        <meta name="keywords" content="chess, games, tracker, FIDE, ratings" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ChessRecord | Pairings</title>
        <link rel="icon" type="image/x-icon" href="Scripts/knight.png" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="Scripts/css/root.css" />
        <link rel="stylesheet" href="Scripts/css/tooltip.css" />
        <link rel="stylesheet" href="Scripts/css/styles.css" />
        <link rel="stylesheet" href="Scripts/css/select.css" />
        <link rel="stylesheet" href="Scripts/css/gameEntry.css" />
        <link rel="stylesheet" href="Scripts/css/pairings.css" />
        <link rel="stylesheet" href="Scripts/css/responsive.css" />
        <link rel="stylesheet" href="Scripts/css/darkTheme.css" />

    </head>
    <body>
        <div class="container container-wide">
            <h1>ChessRecord Pairings</h1>
            <form id="chess-resultsForm" onsubmit="return false;">
                <span class="inlineForm">
                    <input
                        type="url"
                        id="url-input"
                        class="flex"
                        placeholder="Chess-Results Player Profile URL"
                        title="Please enter a valid chess-results player profile URL"
                        required
                        spellcheck="false"
                    />
                    <button type="submit" id="searchURL">
                        <span class="fontawesome" style="white-space: nowrap"
                            ></span
                        >
                        <div class="loader"></div>
                    </button>
                </span>
            </form>
            <div id="player-profile"></div>
            <div class="table" id="pairings-table"></div>
            <div id="note"></div>
        </div>

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- Global Utilities & UI -->
        <script src="https://unpkg.com/dexie@4.0.10/dist/dexie.js"></script>
        <script src="Scripts/js/utils.js"></script>
        <script src="Scripts/js/ui.js"></script>
        <script src="Scripts/js/modal.js"></script>
        <script src="Scripts/js/darkTheme.js"></script>

        <!-- Feature Logic -->
        <script src="Scripts/js/select.js"></script>

        <!-- Page Controller -->
        <script src="Scripts/js/pairings.js"></script>
    </body>
</html>
