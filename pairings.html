<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="ChessRecord - Log and Store Your Chess Games" />
        <meta name="keywords" content="chess, games, tracker, FIDE, ratings" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ChessRecord | Pairings</title>
        <link rel="icon" type="image/x-icon" href="assets/knight.png" />

        <!-- Third-party assets -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;family=Google+Sans+Flex:opsz,wght@6..144,1..1000&amp;family=Rubik:ital,wght@0,300..900;1,300..900&amp;display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Application styles. ORDER MATTERS (later files override earlier ones):
             tokens → base → layout → components → features → modal → dark theme. -->
        <link rel="stylesheet" href="src/css/tokens.css" />
        <link rel="stylesheet" href="src/css/base.css" />
        <link rel="stylesheet" href="src/css/layout.css" />
        <link rel="stylesheet" href="src/css/components/tooltip.css" />
        <link rel="stylesheet" href="src/css/components/loader.css" />
        <link rel="stylesheet" href="src/css/components/player-title.css" />
        <link rel="stylesheet" href="src/css/components/theme-toggle.css" />
        <link rel="stylesheet" href="src/css/features/pairings.css" />
        <link rel="stylesheet" href="src/css/theme-dark.css" />
    </head>
    <body>
        <div class="container container-wide">
            <h1>ChessRecord Pairings</h1>
            <form id="pairings-form">
                <span class="inline-form">
                    <input
                        type="url"
                        id="url-input"
                        class="flex"
                        placeholder="Chess-Results Player Profile URL"
                        title="Please enter a valid chess-results player profile URL"
                        required
                        spellcheck="false"
                    />
                    <button type="submit" id="search-url-btn">
                        <!-- U+F002: Font Awesome "magnifying glass", rendered by the .icon-font font stack -->
                        <span class="icon-font" style="white-space: nowrap">&#xf002;</span>
                        <div class="loader"></div>
                    </button>
                </span>
            </form>
            <div id="player-profile"></div>
            <div class="table" id="pairings-table"></div>
            <div id="note"></div>
        </div>

        <script type="module" src="src/js/pages/pairings.js"></script>
    </body>
</html>
