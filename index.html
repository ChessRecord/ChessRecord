<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="ChessRecord - Log and Store Your Chess Games" />
        <meta name="keywords" content="chess, games, tracker, FIDE, ratings" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ChessRecord</title>
        <link rel="icon" type="image/x-icon" href="assets/knight.png" />

        <!-- Third-party assets -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;family=Google+Sans+Flex:opsz,wght@6..144,1..1000&amp;family=Rubik:ital,wght@0,300..900;1,300..900&amp;display=swap"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Application styles. ORDER MATTERS (later files override earlier ones):
             tokens → base → layout → components → features → modal → dark theme. -->
        <link rel="stylesheet" href="src/css/tokens.css" />
        <link rel="stylesheet" href="src/css/base.css" />
        <link rel="stylesheet" href="src/css/layout.css" />
        <link rel="stylesheet" href="src/css/components/loader.css" />
        <link rel="stylesheet" href="src/css/components/player-title.css" />
        <link rel="stylesheet" href="src/css/components/theme-toggle.css" />
        <link rel="stylesheet" href="src/css/components/select.css" />
        <link rel="stylesheet" href="src/css/components/dropdown-menu.css" />
        <link rel="stylesheet" href="src/css/features/games-list.css" />
        <link rel="stylesheet" href="src/css/features/game-card.css" />
        <link rel="stylesheet" href="src/css/components/modal.css" />
        <link rel="stylesheet" href="src/css/theme-dark.css" />

        <!-- Bare module specifiers used by the scripts. -->
        <script type="importmap">
            { "imports": { "dexie": "https://unpkg.com/dexie@4.0.10/dist/modern/dexie.min.mjs" } }
        </script>
    </head>
    <body>
        <div class="container">
            <h1>ChessRecord</h1>
            <div class="filters">
                <div id="search">
                    <!-- The placeholder starts with U+F002 (Font Awesome "magnifying glass"),
                         rendered by the .icon-font font stack. -->
                    <input
                        type="text"
                        class="icon-font"
                        id="search-input"
                        aria-keyshortcuts="/"
                        placeholder="&#xf002;  Search by player or event name"
                    />
                    <kbd class="search-hint" aria-hidden="true">/</kbd>
                </div>
                <div class="menu-toggle" aria-label="Options menu">
                    <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
                </div>
                <div class="dropdown">
                    <button
                        id="import-btn"
                        class="dropdown-item"
                        aria-label="Import games from file"
                    >
                        <div class="menu-item-content">
                            <i class="fa-solid fa-folder-open"></i>
                            <span class="dropdown-label">Import Games</span>
                        </div>
                        <input
                            type="file"
                            id="file-input"
                            accept=".json,.pgn,.chr"
                            style="display: none"
                            multiple
                        />
                    </button>
                    <button id="export-btn" class="dropdown-item" aria-label="Export games to file">
                        <div class="menu-item-content">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span class="dropdown-label">Export Games</span>
                        </div>
                    </button>
                </div>
            </div>
            <div id="games-list"></div>
        </div>
        <div class="meta-bar">
            <div id="game-count"></div>
            <div id="tournament-count"></div>
        </div>

        <script type="module" src="src/js/pages/home.js"></script>
    </body>
</html>
